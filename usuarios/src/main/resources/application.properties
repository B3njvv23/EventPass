spring.config.import=optional:file:./application-local.properties
spring.application.name=ms-usuarios
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventpass_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
eventpass.jwt.secret=${JWT_SECRET}
eventpass.internal-key=${INTERNAL_KEY}
eventpass.eventos-url=${EVENTOS_URL:http://localhost:8082}
eventpass.tickets-url=${TICKETS_URL:http://localhost:8084}
eventpass.bootstrap.email=${ADMIN_EMAIL:}
eventpass.bootstrap.password=${ADMIN_PASSWORD:}
